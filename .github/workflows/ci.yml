name: 3alimnIA V7.0 Enterprise CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: python validate_release_security.py
      - run: python validate_v7_enterprise.py
      - run: pytest tests/ -q
