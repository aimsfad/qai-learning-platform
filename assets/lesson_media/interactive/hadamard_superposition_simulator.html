<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#f8fbff;--surface:#fff;--surface2:#f8fafc;--border:#d9e4f2;--text:#0f172a;--muted:#475569;--blue:#2563eb;--teal:#0f766e;--indigo:#4f46e5;--soft:#eaf3ff;--softteal:#e6f7f4;--red:#dc2626;--orange:#f97316;}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text)}
.sim{height:790px;max-width:980px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:20px;display:grid;grid-template-rows:auto auto 1fr auto;box-shadow:0 14px 36px rgba(15,23,42,.07);overflow:hidden}
.head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#fff,#f8fbff)}
.kicker{font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}.title{font-size:18px;font-weight:900}.subtitle{font-size:13px;color:var(--muted);margin-top:2px}.counter{text-align:center;color:var(--muted);font-weight:850;font-size:13px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border);background:#fff}.tabbtn{font-weight:850;border:1px solid #cbd5e1;background:#fff;color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer}.tabbtn.active{background:var(--soft);border-color:#93c5fd;color:#1d4ed8;box-shadow:inset 0 0 0 1px #60a5fa}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) 290px;gap:16px;padding:16px;min-height:0;align-items:stretch}.visual{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:500px}.panel{background:#f8fbff;border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}.step{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}.panel h3{margin:0;font-size:19px;line-height:1.2}.panel p{font-size:14px;line-height:1.55;color:#334155;margin:0}.code{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow:hidden}.hl{background:#dbeafe;color:#1d4ed8;border-radius:7px;padding:2px 6px;font-weight:900}.note{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:10px;font-size:13px;line-height:1.5}.foot{padding:11px 16px;border-top:1px solid var(--border);display:grid;grid-template-columns:120px 1fr 120px;align-items:center;background:#fff}.nav{font-weight:850;border:1px solid #cbd5e1;background:#fff;color:var(--text);border-radius:12px;padding:9px 14px;cursor:pointer}.nav:hover{background:var(--soft);border-color:#93c5fd;color:#1d4ed8}.nav:disabled{opacity:.35;cursor:default}svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;fill:var(--text)}.wire{stroke:#94a3b8;stroke-width:2}.cw{stroke:#cbd5e1;stroke-width:1.5}
@media(max-width:760px){.sim{height:870px;border-radius:14px}.stage{grid-template-columns:1fr;grid-template-rows:auto auto}.panel{max-height:280px}}
</style></head><body>
<div class="sim"><div class="head"><div><div class="kicker">Interactive simulator · V12</div><div class="title">Hadamard and superposition</div><div class="subtitle">H changes the state before measurement; counts appear only after measurement.</div></div><div id="snum_head" class="counter">Step 1 / 3</div></div><div class="tabs"><button class="tabbtn" id="tab0" onclick="setStep(0)">1. Start in |0⟩</button><button class="tabbtn" id="tab1" onclick="setStep(1)">2. Apply H</button><button class="tabbtn" id="tab2" onclick="setStep(2)">3. Measure</button></div><div class="stage"><div class="visual"><svg width="620" height="430" viewBox="0 0 620 430"><text x="54" y="52" font-size="18" font-weight="900">q0: |0⟩</text><line class="wire" x1="150" y1="47" x2="560" y2="47"/><g id="hgate"><rect x="250" y="24" width="46" height="46" rx="10" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="273" y="54" font-size="24" font-weight="900" text-anchor="middle" fill="#2563eb">H</text></g><g id="measure"><rect x="440" y="24" width="48" height="48" rx="10" fill="#fff" stroke="#0f766e" stroke-width="3"/><path d="M451 57 A 15 15 0 0 1 481 57" fill="none" stroke="#0f766e" stroke-width="3"/><line x1="466" y1="57" x2="480" y2="38" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/></g><text x="54" y="98" font-size="16" font-weight="900" fill="#475569">c0</text><line class="cw" x1="150" y1="91" x2="560" y2="91"/><line class="cw" x1="150" y1="96" x2="560" y2="96"/><line id="measLine" x1="464" y1="72" x2="464" y2="91" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 4"/><g id="sphere" transform="translate(75,125)"><circle cx="170" cy="120" r="95" fill="none" stroke="#cbd5e1" stroke-width="2"/><ellipse cx="170" cy="120" rx="95" ry="21" fill="none" stroke="#dbe7f5" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="170" y1="25" x2="170" y2="215" stroke="#dbe7f5" stroke-width="1.5" stroke-dasharray="4 4"/><text x="170" y="12" text-anchor="middle" font-size="18" font-weight="900">|0⟩</text><text x="170" y="244" text-anchor="middle" font-size="18" font-weight="900">|1⟩</text><line id="vec" x1="170" y1="120" x2="170" y2="35" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle id="vecTip" cx="170" cy="35" r="6" fill="#2563eb"/><text id="p0" x="205" y="44" fill="#2563eb" font-weight="900" opacity="0">P(0)=50%</text><text id="p1" x="205" y="206" fill="#0f766e" font-weight="900" opacity="0">P(1)=50%</text></g><g id="hist" transform="translate(430,205)" opacity="0"><rect x="0" y="0" width="138" height="130" rx="14" fill="#f8fafc" stroke="#d9e4f2"/><rect x="25" y="55" width="32" height="55" rx="6" fill="#2563eb"/><rect x="82" y="55" width="32" height="55" rx="6" fill="#0f766e"/><text x="41" y="123" text-anchor="middle" font-size="13">0</text><text x="98" y="123" text-anchor="middle" font-size="13">1</text><text x="69" y="27" text-anchor="middle" font-size="13" font-weight="900">counts</text></g><text id="eq" x="355" y="290" font-size="20" font-weight="900" fill="#4f46e5" opacity="0">|ψ⟩ = (|0⟩ + |1⟩) / √2</text></svg></div><div class="panel"><div class="step" id="snum2">Step 1</div><h3 id="stitle"></h3><p id="sbody"></p><div class="code" id="code"></div><div class="note">Use the step buttons or Previous / Next. One visual change at a time.</div></div></div><div class="foot"><button class="nav" id="prev" onclick="prev()">Previous</button><div class="counter" id="snum">Step 1 / 3</div><button class="nav" id="next" onclick="next()">Next</button></div></div>
<script>
const DATA=[{"title": "Start in |0\u27e9", "body": "The qubit begins in a definite |0> state.", "code": "<span class=\"hl\">qc = QuantumCircuit(1, 1)</span>\nqc.h(0)\nqc.measure(0, 0)"}, {"title": "Apply H", "body": "H moves the state toward the equator: the state changes before any classical result exists.", "code": "qc = QuantumCircuit(1, 1)\n<span class=\"hl\">qc.h(0)</span>\nqc.measure(0, 0)"}, {"title": "Measure", "body": "Measurement samples the changed state, giving approximately balanced counts over many shots.", "code": "qc = QuantumCircuit(1, 1)\nqc.h(0)\n<span class=\"hl\">qc.measure(0, 0)</span>"}]; let step=0; const N=DATA.length;
function setStep(n){step=Math.max(0,Math.min(N-1,n));render();}
function prev(){setStep(step-1)} function next(){setStep(step+1)}
function render(){const d=DATA[step];snum.textContent='Step '+(step+1)+' / '+N;snum_head.textContent=snum.textContent;snum2.textContent='Step '+(step+1);stitle.textContent=d.title;sbody.textContent=d.body;code.innerHTML=d.code;prev.disabled=step===0;next.disabled=step===N-1;for(let i=0;i<N;i++){document.getElementById('tab'+i).classList.toggle('active',i===step)};draw(step)}
const CX=170,CY=120,R=85;function draw(i){hgate.style.opacity=i>=1?1:0;measure.style.opacity=i>=2?1:0;measLine.style.opacity=i>=2?1:0;hist.style.opacity=i>=2?1:0;eq.style.opacity=i>=1?1:0;let x=CX,y=CY-R;if(i>=1){x=CX+R;y=CY;}vec.setAttribute('x1',CX);vec.setAttribute('y1',CY);vec.setAttribute('x2',x);vec.setAttribute('y2',y);vecTip.setAttribute('cx',x);vecTip.setAttribute('cy',y);p0.style.opacity=i>=2?1:0;p1.style.opacity=i>=2?1:0}
render();
</script></body></html>
