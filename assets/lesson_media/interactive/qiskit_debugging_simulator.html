<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#f8fbff;--surface:#fff;--surface2:#f8fafc;--border:#d9e4f2;--text:#0f172a;--muted:#475569;--blue:#2563eb;--teal:#0f766e;--indigo:#4f46e5;--soft:#eaf3ff;--softteal:#e6f7f4;--red:#dc2626;--orange:#f97316;}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text)}
.sim{height:790px;max-width:980px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:20px;display:grid;grid-template-rows:auto auto 1fr auto;box-shadow:0 14px 36px rgba(15,23,42,.07);overflow:hidden}
.head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#fff,#f8fbff)}
.kicker{font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}.title{font-size:18px;font-weight:900}.subtitle{font-size:13px;color:var(--muted);margin-top:2px}.counter{text-align:center;color:var(--muted);font-weight:850;font-size:13px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border);background:#fff}.tabbtn{font-weight:850;border:1px solid #cbd5e1;background:#fff;color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer}.tabbtn.active{background:var(--soft);border-color:#93c5fd;color:#1d4ed8;box-shadow:inset 0 0 0 1px #60a5fa}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) 290px;gap:16px;padding:16px;min-height:0;align-items:stretch}.visual{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:500px}.panel{background:#f8fbff;border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}.step{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}.panel h3{margin:0;font-size:19px;line-height:1.2}.panel p{font-size:14px;line-height:1.55;color:#334155;margin:0}.code{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow:hidden}.hl{background:#dbeafe;color:#1d4ed8;border-radius:7px;padding:2px 6px;font-weight:900}.note{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:10px;font-size:13px;line-height:1.5}.foot{padding:11px 16px;border-top:1px solid var(--border);display:grid;grid-template-columns:120px 1fr 120px;align-items:center;background:#fff}.nav{font-weight:850;border:1px solid #cbd5e1;background:#fff;color:var(--text);border-radius:12px;padding:9px 14px;cursor:pointer}.nav:hover{background:var(--soft);border-color:#93c5fd;color:#1d4ed8}.nav:disabled{opacity:.35;cursor:default}svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;fill:var(--text)}.wire{stroke:#94a3b8;stroke-width:2}.cw{stroke:#cbd5e1;stroke-width:1.5}
@media(max-width:760px){.sim{height:870px;border-radius:14px}.stage{grid-template-columns:1fr;grid-template-rows:auto auto}.panel{max-height:280px}}
</style></head><body>
<div class="sim"><div class="head"><div><div class="kicker">Interactive simulator · V12</div><div class="title">Qiskit debugging</div><div class="subtitle">Debugging means matching resources, operations, and outputs.</div></div><div id="snum_head" class="counter">Step 1 / 3</div></div><div class="tabs"><button class="tabbtn" id="tab0" onclick="setStep(0)">1. Run buggy code</button><button class="tabbtn" id="tab1" onclick="setStep(1)">2. Find the bug</button><button class="tabbtn" id="tab2" onclick="setStep(2)">3. Run fixed code</button></div><div class="stage"><div class="visual"><svg width="620" height="430" viewBox="0 0 620 430"><g id="bad"><rect x="50" y="55" width="245" height="235" rx="16" fill="#fff" stroke="#fecaca" stroke-width="2"/><text x="72" y="90" font-size="18" font-weight="900" fill="#dc2626">Buggy code</text><text x="72" y="130" font-size="16" font-family="monospace">QuantumCircuit(1,0)</text><text x="72" y="165" font-size="16" font-family="monospace">qc.measure(0,0)</text><text x="72" y="225" font-size="15" fill="#dc2626">No classical bit exists.</text><text x="72" y="255" font-size="15" fill="#dc2626">measure cannot store result.</text></g><g id="fix"><rect x="330" y="55" width="245" height="235" rx="16" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="352" y="90" font-size="18" font-weight="900" fill="#0f766e">Fixed code</text><text x="352" y="130" font-size="16" font-family="monospace">QuantumCircuit(1,1)</text><text x="352" y="165" font-size="16" font-family="monospace">qc.measure(0,0)</text><text x="352" y="225" font-size="15" fill="#0f766e">c0 exists.</text><text x="352" y="255" font-size="15" fill="#0f766e">The result is stored.</text></g><text id="msg" x="310" y="350" text-anchor="middle" font-size="22" font-weight="900" fill="#4f46e5">Find the missing classical bit</text></svg></div><div class="panel"><div class="step" id="snum2">Step 1</div><h3 id="stitle"></h3><p id="sbody"></p><div class="code" id="code"></div><div class="note">Use the step buttons or Previous / Next. One visual change at a time.</div></div></div><div class="foot"><button class="nav" id="prev" onclick="prev()">Previous</button><div class="counter" id="snum">Step 1 / 3</div><button class="nav" id="next" onclick="next()">Next</button></div></div>
<script>
const DATA=[{"title": "Run buggy code", "body": "The circuit has one qubit but zero classical bits.", "code": "<span class=\"hl\">qc = QuantumCircuit(1, 0)</span>\nqc.measure(0, 0)"}, {"title": "Find the bug", "body": "The measurement tries to write into c0, but c0 was never allocated.", "code": "qc.measure(0, <span class=\"hl\">0</span>)  # needs c0"}, {"title": "Run fixed code", "body": "Allocate one classical bit so the measurement has a destination.", "code": "<span class=\"hl\">qc = QuantumCircuit(1, 1)</span>\nqc.measure(0, 0)"}]; let step=0; const N=DATA.length;
function setStep(n){step=Math.max(0,Math.min(N-1,n));render();}
function prev(){setStep(step-1)} function next(){setStep(step+1)}
function render(){const d=DATA[step];snum.textContent='Step '+(step+1)+' / '+N;snum_head.textContent=snum.textContent;snum2.textContent='Step '+(step+1);stitle.textContent=d.title;sbody.textContent=d.body;code.innerHTML=d.code;prev.disabled=step===0;next.disabled=step===N-1;for(let i=0;i<N;i++){document.getElementById('tab'+i).classList.toggle('active',i===step)};draw(step)}
function draw(i){bad.style.opacity=i>=0?1:.25;fix.style.opacity=i>=2?1:.25;msg.textContent=i===0?'Run the buggy code':(i===1?'The second argument is 0 classical bits':'Change it to 1 classical bit')}
render();
</script></body></html>
