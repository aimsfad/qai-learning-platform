# Copy this file to .streamlit/secrets.toml for local use.
# Never commit secrets.toml or API keys to GitHub.

# Evaluator protection
EVALUATOR_USERNAME = "evaluator"
ADMIN_PASSWORD = "change-this-strong-password"
# Optional stronger alternative:
# python make_password_hash.py
# EVALUATOR_PASSWORD_HASH = "pbkdf2_sha256$..."

# Optional public registration gate
REGISTRATION_ACCESS_CODE = "3alimnia-study-2026"

# Optional controlled study design
ENABLE_CONTROL_GROUP = "false"

# Recommended cloud database for production
# DATABASE_URL = "postgresql+psycopg2://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require"

# Primary tutor provider: groq, gemini, openai, anthropic, openrouter, or local
LLM_PROVIDER = "groq"
GROQ_API_KEY = "paste-your-groq-key-here"
GROQ_MODEL = "openai/gpt-oss-20b"
GROQ_BASE_URL = "https://api.groq.com/openai/v1"

# Teacher content generation. The 120B model is used for deeper educational production.
CONTENT_LLM_PROVIDER = "groq"
CONTENT_GROQ_MODEL = "openai/gpt-oss-120b"
FAST_GROQ_MODEL = "openai/gpt-oss-20b"
ENABLE_MODEL_FALLBACK = "true"
CONTENT_GENERATION_TIMEOUT_SECONDS = "120"

# Gemini multimodal file analysis
FILE_ANALYSIS_PROVIDER = "gemini"
GEMINI_API_KEY = "paste-your-gemini-key-here"
GEMINI_MODEL = "gemini-3.6-flash"
FILE_ANALYSIS_GEMINI_MODEL = "gemini-3.6-flash"
FILE_ANALYSIS_MAX_FILES = "6"
FILE_ANALYSIS_MAX_FILE_MB = "12"
FILE_ANALYSIS_MAX_TOTAL_CHARS = "90000"
FILE_ANALYSIS_MAX_OUTPUT_TOKENS = "6000"
FILE_ANALYSIS_TIMEOUT_SECONDS = "120"
GEMINI_ANALYZE_TEXT_FILES = "true"

# Optional OpenRouter fallback. Keep a free model or router ID unless paid use is intentional.
# OPENROUTER_API_KEY = "sk-or-v1-..."
# OPENROUTER_MODEL = "openrouter/free"
# OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
# OPENROUTER_APP_NAME = "3alimnIA"

# Optional direct OpenAI provider
# OPENAI_API_KEY = "sk-..."
# OPENAI_MODEL = "gpt-4o-mini"
# OPENAI_BASE_URL = "https://api.openai.com/v1"

# Optional Anthropic provider
# ANTHROPIC_API_KEY = "sk-ant-..."
# ANTHROPIC_MODEL = "claude-3-5-haiku-latest"
# ANTHROPIC_BASE_URL = "https://api.anthropic.com/v1"
# ANTHROPIC_VERSION = "2023-06-01"

# Auxiliary services reserved for future RAG and serverless inference modules.
# They are detected safely by V6.10 but are not required for Gemini file analysis.
# COHERE_API_KEY = "..."
# CLOUDFLARE_ACCOUNT_ID = "..."
# CLOUDFLARE_API_TOKEN = "..."

# Password reset settings
APP_BASE_URL = "https://your-streamlit-app-url.streamlit.app"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_USERNAME = "your_email@example.com"
SMTP_PASSWORD = "your_app_password_here"
SMTP_FROM = "your_email@example.com"
SMTP_USE_SSL = "false"
SHOW_RESET_LINK_FOR_DEBUG = "false"

# Teacher account creation
# Teachers can create their own password-protected accounts in the platform.
TEACHER_ALLOW_REGISTRATION = "true"
# Optional: require this shared code before a teacher account can be created.
# TEACHER_REGISTRATION_CODE = "replace-with-a-private-invitation-code"

# Optional legacy administrator teacher account. Leave unset when database-backed
# self-registration is sufficient. Never use a default password in production.
# TEACHER_USERNAME = "teacher-admin"
# TEACHER_PASSWORD = "replace-with-a-strong-password"
# Recommended stronger alternative:
# TEACHER_PASSWORD_HASH = "pbkdf2_sha256$..."

# V6.11 educational content builder reliability controls
CONTENT_CONNECT_TIMEOUT_SECONDS = "15"
CONTENT_GENERATION_RETRIES = "2"
# Optional: enable Groq GPT-OSS browser search for evidence-sensitive phases
# (Phase 1 evidence audit and Phase 11 quality assurance). This may add cost.
ENABLE_CONTENT_WEB_RESEARCH = "false"
CONTENT_REASONING_EFFORT = "low"

# V6.11.1 provider-aware prompt budgeting (recommended for constrained Groq tiers)
ENABLE_PROVIDER_PROMPT_BUDGETING = "true"
CONTENT_GROQ_TOTAL_TOKEN_BUDGET = "7000"
CONTENT_GROQ_MAX_OUTPUT_TOKENS = "2600"
CONTENT_GROQ_TOKEN_RESERVE = "350"
# Automatic second attempt when Groq still returns HTTP 413 / TPM overflow.
CONTENT_GROQ_STRICT_INPUT_TOKENS = "2200"
CONTENT_GROQ_STRICT_OUTPUT_TOKENS = "1700"
# Fallback providers may return longer educational artifacts.
CONTENT_GEMINI_MAX_OUTPUT_TOKENS = "6000"
CONTENT_OPENROUTER_MAX_OUTPUT_TOKENS = "5000"
CONTENT_OPENAI_MAX_OUTPUT_TOKENS = "5000"
CONTENT_ANTHROPIC_MAX_OUTPUT_TOKENS = "5000"

# V6.12 research-augmented educational generation
# The research pass is separated from the final writing pass and cached per phase.
ENABLE_RESEARCH_AUGMENTED_GENERATION = "true"
DEFAULT_CONTENT_RESEARCH_MODE = "balanced" # off, quick, balanced, deep
CONTENT_RESEARCH_PROVIDER = "gemini"        # gemini first; groq is the fallback
CONTENT_GEMINI_RESEARCH_MODEL = "gemini-3.6-flash"
CONTENT_GROQ_RESEARCH_MODEL = "groq/compound"
CONTENT_RESEARCH_MAX_OUTPUT_TOKENS = "4200"
CONTENT_RESEARCH_TIMEOUT_SECONDS = "180"
CONTENT_RESEARCH_RETRIES = "1"
# Optional country boost for Groq Compound search, for example: algeria, france.
CONTENT_RESEARCH_COUNTRY = ""
CONTENT_GROQ_QUICK_RESEARCH_MODEL = "groq/compound-mini"
# V6.13.1 bounded Groq research request and strict Compound Mini retry
CONTENT_GROQ_RESEARCH_INPUT_TOKENS = "1600"
CONTENT_GROQ_RESEARCH_MAX_OUTPUT_TOKENS = "1800"
CONTENT_GROQ_RESEARCH_STRICT_INPUT_TOKENS = "850"
CONTENT_GROQ_RESEARCH_STRICT_OUTPUT_TOKENS = "900"

# V6.13 evidence synthesis foundation
# Converts the latest research dossier into scored sources, evidence cards,
# and candidate concepts before lesson generation.
ENABLE_EVIDENCE_SYNTHESIS = "true"
# Recommended for the research workflow: generation waits until the teacher
# approves the evidence bundle in the Evidence synthesis workspace.
REQUIRE_EVIDENCE_APPROVAL_FOR_GENERATION = "true"
EVIDENCE_MAX_CARDS = "12"
EVIDENCE_MAX_CONCEPTS = "10"
EVIDENCE_MIN_COMPOSITE_SCORE = "0.55"

# V6.14 evidence-to-lesson blueprint
# Converts approved evidence into a concept graph, units, lessons, measurable
# outcomes, and activity-assessment alignments before phase 3 generation.
ENABLE_LESSON_BLUEPRINT = "true"
REQUIRE_BLUEPRINT_APPROVAL_FOR_GENERATION = "true"
BLUEPRINT_MAX_UNITS = "5"
BLUEPRINT_MAX_LESSONS = "12"
BLUEPRINT_MIN_READINESS = "0.70"

# V6.15 manual blueprint editor and immutable versioning
# Lets teachers edit units, lessons, outcomes, order, and alignment before approval.
ENABLE_BLUEPRINT_EDITOR = "true"
# Recommended: require a human-readable reason for each saved revision.
BLUEPRINT_EDITOR_REQUIRE_CHANGE_SUMMARY = "true"

# V6.16 block-level lesson generation
ENABLE_LESSON_BLOCK_GENERATION = "true"
REQUIRE_BLOCK_APPROVAL_FOR_LESSON_COMPLETION = "true"

# V6.17 hybrid background production
PRODUCTION_QUEUE_BACKEND = "auto" # auto | rq | inline
REDIS_URL = ""
PRODUCTION_QUEUE_NAME = "3alimnia-production"
PRODUCTION_JOB_TIMEOUT = "900"
PRODUCTION_JOB_RETRIES = "2"
BACKGROUND_RESEARCH_MODE = "off"
BACKGROUND_RESEARCH_MAX_SOURCES = "6"

# V6.18.3 guided lesson-block sequence
LESSON_BLOCK_REQUIRE_SEQUENCE = "true"

# V6.18.4 simple teacher journey (recommended default)
TEACHER_SIMPLE_MODE_DEFAULT = "true"
