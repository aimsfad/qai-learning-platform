[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1660FF"
backgroundColor = "#F8FBFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0A1730"
font = "sans-serif"
baseRadius = "1rem"
buttonRadius = "0.85rem"
showWidgetBorder = true
showSidebarBorder = true
borderColor = "#DCE6FA"
dataframeBorderColor = "#DCE6FA"
dataframeHeaderBackgroundColor = "#EEF3FC"
chartCategoricalColors = ["#1660FF", "#12C8E6", "#F0A825", "#12B981", "#7C6CF2", "#F0475E"]
chartSequentialColors = ["#EEF3FC", "#CFE1FF", "#A6C8FF", "#5B93FF", "#1660FF", "#0B4CD1", "#0A1636"]
