[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1F3DFF"
backgroundColor = "#F6FBFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0A1830"
font = "sans-serif"
baseRadius = "1.25rem"
buttonRadius = "999px"
showWidgetBorder = true
showSidebarBorder = false
borderColor = "#D6E7FF"
dataframeBorderColor = "#D6E7FF"
dataframeHeaderBackgroundColor = "#EAF4FF"
chartCategoricalColors = ["#0A66FF", "#04D9C7", "#1F3DFF", "#22E8D4", "#2F7BFF", "#049E91"]
chartSequentialColors = ["#EAF4FF", "#CFE7FF", "#A6D4FF", "#73B8FF", "#3D8CF6", "#0A66FF", "#001A8F"]
